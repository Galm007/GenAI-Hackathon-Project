description = "Do the next MASTER_PLAN step for my track (one commit), following AGENTS.md §3"

prompt = """
Follow the step protocol in AGENTS.md §3 exactly.

- Step to do: {{args}}. If that's empty, take the first unchecked step in my track in docs/ROADMAP.md whose dependencies are all checked. If you don't know my track, ask me once.
- Announce the step, read only the plan sections it lists, implement just that step, run its "done when" checks, update docs/ROADMAP.md (and docs/DECISIONS.md if you deviated), make exactly one commit, then stop.
- End with the end-of-step report from AGENTS.md §8. Don't push, and don't start another step, unless I say so.
"""
